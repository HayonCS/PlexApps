query GetMemoryMap($memoryMapName: String!, $bomRevision: String!, $version: Int!) {
  getMemoryMap(memoryMapName: $memoryMapName, bomRevision: $bomRevision, version: $version) {
    name
    bomRevision
    version
    isWorkingCopy
    concurrencyToken
    commandset
    commands
    testers
    partNumbers
  }
}
