mutation SaveRecentMemoryMap($userName: String!, $memoryMapName: String!, $bomRevision: String!, $version: Int!, $lastAccessed: String!) {
  saveRecentMemoryMap(
    userName: $userName
    memoryMapName: $memoryMapName
    bomRevision: $bomRevision
    version: $version
  ) {
    recentMemoryMaps {
      memoryMapName
      bomRevision
      version
    }
  }
}
