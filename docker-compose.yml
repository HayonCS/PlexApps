version: "3.7"
services:
  dev:
    build: docker/dev
    command: /usr/local/lib/tail-and-wait
    ipc: host
    volumes:
      - devappdata:/home/dev/app
      - devconfigdata:/home/dev/config
    ports:
      - "3000:3000" # Vite dev server
      - "3001:3001" # Express server
      - "4000:4000" # Web Socket

  redis:
    image: redis:4
    ipc: host
    ports:
      - "6379:6379"

volumes:
  devappdata:
  devconfigdata:
