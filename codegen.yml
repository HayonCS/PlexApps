generates:
  modules/client/graphql/types.gen.tsx:
    config:
      withHooks: true
      withComponent: false
      withHOC: false
      apolloReactHooksImportFrom: "@apollo/client"
      apolloClientVersion: 3
    schema:
      - "modules/graphql-api/schema.graphql"
      - "modules/client/graphql/schema.graphql"
    documents:
      - "modules/client/graphql/*/*.graphql"
    plugins:
      - add:
          content:
            - 'import * as DateTimeIso from "modules/core/date-time-iso";'
            - 'import * as DateIso from "modules/core/date-iso";'
            - 'import * as TimeIso from "modules/core/time-iso";'
            - 'import { UserNameOrEmployeeNumber } from "modules/helpers/user-information"'
            - 'import { ADMemberResponse, SearchByType, GroupType } from "modules/rest-endpoints/active-directory/active-directory-api"'
            - 'import { SavedMemoryMapsRecord } from "modules/records/memorymaps"'
            - 'import { SavedMemoryMapDataRecord } from "modules/records/memorymapdata"'
            - 'import { SavedCommandSetDataRecord } from "modules/records/commandsetdata"'
            - 'import { Testers, PartNumbers, Commands, Commandset } from "modules/core/schemas/memory-map.gen.ts"'
            - 'import { UserSettings } from "modules/core/schemas/user-settings.gen"'
            - 'import { CommandSetDocument } from "modules/core/schemas/commandset.gen"'
            - 'import { Tester, TestStation, TesterWithTestStations } from "modules/client/components/editor/TestersDialog.utils.tsx"'
      - "typescript":
          scalars:
            IsoDateTime: DateTimeIso.Type
            IsoDate: DateIso.Type
            IsoTime: TimeIso.Type
            UserNameOrEmployeeNumber: UserNameOrEmployeeNumber
            ADMemberResponse: ADMemberResponse
            SearchByType: SearchByType
            GroupType: GroupType
            SavedMemoryMapsRecord: SavedMemoryMapsRecord
            SavedMemoryMapDataRecord: SavedMemoryMapDataRecord
            SavedCommandSetDataRecord: SavedCommandSetDataRecord
            Testers: Testers
            Tester: Tester
            TesterWithTestStations: TesterWithTestStations
            TestStation: TestStation
            PartNumbers: PartNumbers
            Commands: Commands
            Commandset: Commandset
            UserSettings: UserSettings
            CommandSetDocument: CommandSetDocument
            AppLogMetaData: "Record<string, string | number | boolean>"
      - "typescript-operations"
      - "typescript-react-apollo"
      - "typescript-resolvers":
          contextType: context#ApiContext
          defaultMapper: any
  modules/graphql-api/server-types.gen.ts:
    schema:
      - "modules/graphql-api/schema.graphql"
    plugins:
      - add:
          content:
            - 'import * as DateTimeIso from "modules/core/date-time-iso";'
            - 'import * as DateIso from "modules/core/date-iso";'
            - 'import * as TimeIso from "modules/core/time-iso";'
            - 'import { UserNameOrEmployeeNumber } from "modules/helpers/user-information"'
            - 'import { ADMemberResponse, SearchByType, GroupType } from "modules/rest-endpoints/active-directory/active-directory-api"'
            - 'import { SavedMemoryMapsRecord } from "modules/records/memorymaps"'
            - 'import { SavedMemoryMapDataRecord } from "modules/records/memorymapdata"'
            - 'import { SavedCommandSetDataRecord } from "modules/records/commandsetdata"'
            - 'import { Testers, PartNumbers, Commands, Commandset } from "modules/core/schemas/memory-map.gen.ts"'
            - 'import { UserSettings } from "modules/core/schemas/user-settings.gen"'
            - 'import { CommandSetDocument } from "modules/core/schemas/commandset.gen"'
            - 'import { Tester, TestStation, TesterWithTestStations } from "modules/client/components/editor/TestersDialog.utils.tsx"'
      - "typescript":
          scalars:
            IsoDateTime: DateTimeIso.Type
            IsoDate: DateIso.Type
            IsoTime: TimeIso.Type
            UserNameOrEmployeeNumber: UserNameOrEmployeeNumber
            ADMemberResponse: ADMemberResponse
            SearchByType: SearchByType
            GroupType: GroupType
            SavedMemoryMapsRecord: SavedMemoryMapsRecord
            SavedMemoryMapDataRecord: SavedMemoryMapDataRecord
            SavedCommandSetDataRecord: SavedCommandSetDataRecord
            Testers: Testers
            Tester: Tester
            TestStation: TestStation
            TesterWithTestStations: TesterWithTestStations
            PartNumbers: PartNumbers
            Commands: Commands
            Commandset: Commandset
            UserSettings: UserSettings
            CommandSetDocument: CommandSetDocument
            AppLogMetaData: "Record<string, string | number | boolean>"
      - "typescript-operations"
      - "typescript-resolvers":
          contextType: context#ApiContext
          defaultMapper: any
  modules/client/graphql/introspection-result.gen.json:
    schema:
      - "modules/graphql-api/schema.graphql"
      - "modules/client/graphql/schema.graphql"
    plugins:
      - "fragment-matcher":
    config:
      apolloClientVersion: 3
